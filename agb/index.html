<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Allgemeine Geschäftsbedingungen · aumann eco</title>
<style>
  :root{ --coral:#FF634D; --near-black:#222120; --off-white:#FCFAF5; }
  *{ box-sizing:border-box; }
  html{ overflow-x:clip; }
  body{ margin:0; font-family:'Volte','Inter',system-ui,-apple-system,sans-serif; background:var(--off-white); color:var(--near-black); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; }
  .ph-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 24px; width:100%; max-width:1180px; margin:0 auto; }
  .ph-header img{ height:34px; display:block; }
  .ph-back{ font-size:14px; font-weight:600; color:var(--near-black); text-decoration:none; white-space:nowrap; }
  .ph-back:hover{ color:var(--coral); }
  .ph-main{ flex:1; width:100%; max-width:680px; margin:0 auto; padding:7vh 24px 11vh; }
  .ph-eyebrow{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:var(--coral); }
  .ph-main h1{ font-size:clamp(32px,6vw,54px); font-weight:700; line-height:1.06; letter-spacing:-0.02em; margin:14px 0 16px; overflow-wrap:break-word; }
  .ph-badge{ display:inline-block; margin-bottom:22px; font-size:13px; font-weight:600; color:var(--coral); background:rgba(255,99,77,0.10); padding:6px 14px; border-radius:999px; }
  .ph-main p{ font-size:18px; line-height:1.6; color:rgba(34,33,32,0.72); max-width:54ch; margin:0; }
  .ph-btn{ display:inline-flex; align-items:center; gap:8px; margin-top:34px; background:var(--coral); color:var(--near-black); font-weight:600; text-decoration:none; padding:15px 28px; border-radius:999px; }
  .ph-btn:hover{ background:#ed553f; }
  .ph-footer{ border-top:1px solid rgba(34,33,32,0.1); width:100%; max-width:1180px; margin:0 auto; padding:26px 24px; display:flex; flex-wrap:wrap; gap:8px 22px; font-size:13px; color:rgba(34,33,32,0.55); }
  .ph-footer a{ color:rgba(34,33,32,0.72); text-decoration:none; }
  .ph-footer a:hover{ color:var(--coral); }
</style>
</head>
<body>
  <header class="ph-header">
    <a href="/aumann-eco-preview/" aria-label="aumann eco — Startseite"><img src="/aumann-eco-preview/assets/logos/aumanneco_Wortbildmarke-rot.svg" alt="aumann eco"></a>
    <a class="ph-back" href="/aumann-eco-preview/">← Zur Startseite</a>
  </header>
  <main class="ph-main">
    <span class="ph-eyebrow">Rechtliches</span>
    <h1>Allgemeine Geschäftsbedingungen</h1>
    <span class="ph-badge">In Vorbereitung</span>
    <p>Unsere AGB werden gerade finalisiert und folgen in Kürze. Bei Fragen zu Leistungen und Konditionen melde dich gern direkt bei uns.</p>
    <a class="ph-btn" href="/aumann-eco-preview/kontakt/">Zum Kontakt →</a>
  </main>
  <footer class="ph-footer">
    <span>© 2026 aumann eco GmbH</span>
    <a href="/aumann-eco-preview/impressum/">Impressum</a>
    <a href="/aumann-eco-preview/datenschutz/">Datenschutz</a>
    <a href="/aumann-eco-preview/">Startseite</a>
  </footer>
</body>
</html>
